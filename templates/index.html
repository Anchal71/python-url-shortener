<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        a {
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔗 URL Shortener</h1>

        <p>Convert your long URL into a short URL.</p>

        <form method="POST">
            <input
                type="url"
                name="url"
                placeholder="Enter your long URL"
                required
            >

            <br>

            <button type="submit">Shorten URL</button>
        </form>

        {% if short_url %}
        <div class="result">
            <h3>Your Short URL:</h3>
            <a href="{{ short_url }}" target="_blank">
                {{ short_url }}
            </a>
        </div>
        {% endif %}

    </div>

</body>
  </html>
